<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#F2EEE3"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Folio"/>
<link rel="manifest" href="manifest.json"/>
<title>Folio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F2EEE3;--elev:#FAF7F0;--text:#1A1A1A;--muted:#6B6560;
  --acc:#E8212B;--soft:rgba(232,33,43,.14);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --tab:60px;--r:14px;
}
[data-theme=dark]{
  --bg:#0D0D0D;--elev:#1A1A1A;--text:#F5F5F5;--muted:#9A9A9A;
  --acc:#FF3B5C;--soft:rgba(255,59,92,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:0;border:0;cursor:pointer;touch-action:manipulation}
img{max-width:100%;display:block}
#app{min-height:100dvh;padding:var(--st) 0 calc(var(--tab) + var(--sb));display:flex;flex-direction:column;width:100%;max-width:100vw}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:20;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:1.1rem;flex-shrink:0}
.brand span{font-weight:700;font-size:1.2rem}
.actions{display:flex;gap:2px;flex-shrink:0}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:999px;font-size:18px}
.ib:active{background:var(--soft)}
.greet{padding:6px 16px 14px}
.greet h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.35rem,5vw,1.75rem);font-weight:700}
.greet p{color:var(--muted);font-size:.9rem;margin-top:2px}
.filters{display:flex;gap:8px;padding:0 14px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--elev);color:var(--muted);font-size:.85rem;font-weight:500;min-height:36px}
.filters button.on{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 14px 28px;width:100%}
@media(min-width:420px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));max-width:900px;margin:0 auto;gap:18px}}
.card{min-width:0;cursor:pointer}
.card:active{opacity:.85}
.cover{aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--elev);position:relative;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.cover .art{width:100%;height:100%;display:flex;align-items:flex-end;padding:12px;background:linear-gradient(155deg,#1a1a1a,#E8212B);color:#fff;font-family:Georgia,serif;font-weight:700;font-size:.9rem;line-height:1.25}
.badge{position:absolute;top:6px;left:6px;font-size:.58rem;font-weight:700;text-transform:uppercase;background:rgba(0,0,0,.7);color:#fff;padding:3px 6px;border-radius:4px}
.ct{margin-top:7px;font-size:.8rem;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:.7rem;color:var(--muted);margin-top:2px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;color:var(--muted)}
.empty[hidden]{display:none!important}
.empty h2{color:var(--text);font-size:1.15rem;margin:10px 0 6px}
.empty p{margin-bottom:18px;font-size:.92rem;max-width:260px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 26px;background:var(--acc);color:#fff;font-weight:600;border-radius:999px;min-height:46px;box-shadow:0 4px 16px var(--soft)}
.btn:active{transform:scale(.97)}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(var(--tab) + var(--sb) + 10px);width:54px;height:54px;border-radius:50%;background:var(--acc);color:#fff;font-size:28px;line-height:1;display:grid;place-items:center;z-index:35;box-shadow:0 6px 22px rgba(232,33,43,.45)}
.fab:active{transform:scale(.92)}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:5px 0 calc(5px + var(--sb));background:var(--elev);border-top:1px solid rgba(128,128,128,.15);z-index:40}
.bar button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 10px;min-width:54px;color:var(--muted);font-size:.62rem;font-weight:500}
.bar button.on{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sb) + 72px);transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.88rem;font-weight:500;z-index:200;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#reader{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column}
#reader.on{display:flex}
#rhead{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + var(--st));background:var(--elev);border-bottom:1px solid rgba(128,128,128,.12)}
#rhead b{flex:1;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
#rbody iframe{width:100%;height:100%;border:0;min-height:100%}
#rbody .txt{padding:18px 16px;max-width:640px;margin:0 auto;line-height:1.65;font-size:17px}
#rbody .txt h1,#rbody .txt h2{font-family:Georgia,serif;margin:1.2em 0 .4em}
#rbody .pages{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
#rbody .pages img{max-width:100%;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.spin{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="brand"><div class="logo">F</div><span>Folio</span></div>
    <div class="actions">
      <button type="button" class="ib" id="btnTheme" title="Light/Dark">◐</button>
      <button type="button" class="ib" id="btnClear" title="Clear">⌫</button>
    </div>
  </header>
  <section class="greet">
    <h1 id="hi">Hello</h1>
    <p>Your library</p>
  </section>
  <nav class="filters" id="filters">
    <button type="button" class="on" data-f="all">All</button>
    <button type="button" data-f="book">Books</button>
    <button type="button" data-f="comic">Comics</button>
    <button type="button" data-f="doc">Docs</button>
  </nav>
  <section class="grid" id="grid"></section>
  <div class="empty" id="empty">
    <div style="font-size:42px;opacity:.4">📚</div>
    <h2>Your library is empty</h2>
    <p>Tap Import to add PDF, EPUB, DOCX or comics</p>
    <button type="button" class="btn" id="btnImport">Import files</button>
  </div>
</div>
<button type="button" class="fab" id="fab" aria-label="Import">+</button>
<nav class="bar">
  <button type="button" class="on" id="navHome">🏠<span>Home</span></button>
  <button type="button" id="navImport">＋<span>Import</span></button>
  <button type="button" id="navTheme">◐<span>Theme</span></button>
</nav>
<div id="reader">
  <div id="rhead">
    <button type="button" class="ib" id="rClose">←</button>
    <b id="rTitle">Reading</b>
  </div>
  <div id="rbody"><div class="spin">Loading…</div></div>
</div>
<input type="file" id="file" multiple accept="*/*" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0"/>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function(){
'use strict';
var books=[], filter='all', db=null;
var $=function(s){return document.querySelector(s)};
var fileEl=$('#file'), grid=$('#grid'), empty=$('#empty'), toastEl=$('#toast');

function toast(m){
  toastEl.textContent=m;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){toastEl.classList.remove('show')},2800);
}

function openPicker(){
  try{
    fileEl.value='';
    fileEl.click();
  }catch(e){
    alert('File picker blocked: '+e.message);
  }
}

['btnImport','fab','navImport'].forEach(function(id){
  var el=document.getElementById(id);
  if(el) el.onclick=function(e){e.preventDefault();openPicker()};
});

function greet(){
  var h=new Date().getHours();
  $('#hi').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
}

/* ---- IndexedDB ---- */
function openDB(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('folio-v3',1);
    r.onupgradeneeded=function(){
      var d=r.result;
      if(!d.objectStoreNames.contains('books')) d.createObjectStore('books',{keyPath:'id'});
      if(!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs',{keyPath:'id'});
    };
    r.onsuccess=function(){db=r.result;res(db)};
    r.onerror=function(){rej(r.error)};
  });
}
function idbPut(store,val){
  return new Promise(function(res,rej){
    var tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(val);
    tx.oncomplete=function(){res()};
    tx.onerror=function(){rej(tx.error)};
  });
}
function idbGet(store,id){
  return new Promise(function(res,rej){
    var tx=db.transaction(store,'readonly');
    var q=tx.objectStore(store).get(id);
    q.onsuccess=function(){res(q.result)};
    q.onerror=function(){rej(q.error)};
  });
}
function idbAll(store){
  return new Promise(function(res,rej){
    var tx=db.transaction(store,'readonly');
    var q=tx.objectStore(store).getAll();
    q.onsuccess=function(){res(q.result||[])};
    q.onerror=function(){rej(q.error)};
  });
}
function idbDel(store,id){
  return new Promise(function(res,rej){
    var tx=db.transaction(store,'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete=function(){res()};
    tx.onerror=function(){rej(tx.error)};
  });
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function detect(f){
  var n=(f.name||'').toLowerCase(), t=(f.type||'').toLowerCase();
  if(n.endsWith('.pdf')||t.indexOf('pdf')>=0) return 'pdf';
  if(n.endsWith('.epub')) return 'epub';
  if(n.endsWith('.docx')) return 'docx';
  if(n.endsWith('.cbz')||n.endsWith('.zip')) return 'cbz';
  if(n.endsWith('.cbr')) return 'cbr';
  return null;
}

fileEl.addEventListener('change',function(){
  var files=[].slice.call(fileEl.files||[]);
  if(!files.length) return;
  toast('Importing '+files.length+'…');
  var i=0;
  function next(){
    if(i>=files.length){refresh();toast('Import complete');return}
    var f=files[i++];
    importOne(f).then(next).catch(function(err){
      console.error(err);
      toast((f.name||'File')+': '+(err.message||'failed'));
      next();
    });
  }
  next();
});

async function importOne(f){
  if(f.size>120*1024*1024) throw new Error('Too large (max 120MB)');
  var format=detect(f);
  if(!format) throw new Error('Unsupported type');
  var id=uid();
  var title=(f.name||'Untitled').replace(/\.[^.]+$/,'');
  var buf=await f.arrayBuffer();
  await idbPut('blobs',{id:id,blob:new Blob([buf],{type:f.type||'application/octet-stream'})});
  var meta={id:id,title:title,format:format,added:Date.now(),progress:0};
  await idbPut('books',meta);
  books.unshift(meta);
}

async function refresh(){
  books=await idbAll('books');
  books.sort(function(a,b){return (b.added||0)-(a.added||0)});
  render();
}

function render(){
  var list=books.filter(function(b){
    if(filter==='all') return true;
    if(filter==='book') return b.format==='epub'||b.format==='docx';
    if(filter==='comic') return b.format==='cbz'||b.format==='cbr';
    if(filter==='doc') return b.format==='pdf'||b.format==='docx';
    return true;
  });
  empty.hidden=books.length>0;
  grid.innerHTML='';
  list.forEach(function(b){
    var el=document.createElement('article');
    el.className='card';
    el.innerHTML='<div class="cover"><div class="art">'+esc(b.title)+'</div><span class="badge">'+b.format+'</span></div>'+
      '<div class="ct">'+esc(b.title)+'</div><div class="cs">'+b.format.toUpperCase()+'</div>';
    el.onclick=function(){openBook(b)};
    grid.appendChild(el);
  });
}

async function openBook(b){
  $('#reader').classList.add('on');
  $('#rTitle').textContent=b.title;
  var body=$('#rbody');
  body.innerHTML='<div class="spin">Loading…</div>';
  try{
    var rec=await idbGet('blobs',b.id);
    if(!rec||!rec.blob) throw new Error('File missing');
    var blob=rec.blob;
    if(b.format==='pdf') await showPDF(body,blob);
    else if(b.format==='docx') await showDOCX(body,blob);
    else if(b.format==='cbz') await showComic(body,blob);
    else if(b.format==='epub') await showEPUB(body,blob);
    else if(b.format==='cbr') body.innerHTML='<div class="spin">CBR: convert to CBZ for best results, or try again on Wi‑Fi with full libraries.</div>';
    else body.innerHTML='<div class="spin">Unsupported</div>';
  }catch(e){
    body.innerHTML='<div class="spin">'+esc(e.message||String(e))+'</div>';
  }
}

async function showPDF(body,blob){
  if(!window.pdfjsLib){
    var url=URL.createObjectURL(blob);
    body.innerHTML='<iframe src="'+url+'#toolbar=1" title="PDF"></iframe>';
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  var data=await blob.arrayBuffer();
  var pdf=await pdfjsLib.getDocument({data:data}).promise;
  var wrap=document.createElement('div');
  wrap.className='pages';
  body.innerHTML='';
  body.appendChild(wrap);
  var max=Math.min(pdf.numPages,40);
  for(var i=1;i<=max;i++){
    var page=await pdf.getPage(i);
    var scale=Math.min(1.4, (body.clientWidth-16)/page.getViewport({scale:1}).width);
    var vp=page.getViewport({scale:scale||1});
    var canvas=document.createElement('canvas');
    canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    wrap.appendChild(canvas);
  }
  if(pdf.numPages>40){
    var more=document.createElement('p');
    more.className='spin';
    more.textContent='Showing first 40 of '+pdf.numPages+' pages';
    wrap.appendChild(more);
  }
}

async function showDOCX(body,blob){
  if(!window.mammoth) throw new Error('DOCX engine not loaded (need network once)');
  var r=await mammoth.convertToHtml({arrayBuffer:await blob.arrayBuffer()});
  body.innerHTML='<div class="txt">'+r.value+'</div>';
}

async function showComic(body,blob){
  if(!window.JSZip) throw new Error('Zip engine not loaded (need network once)');
  var zip=await JSZip.loadAsync(blob);
  var names=Object.keys(zip.files).filter(function(n){return /\.(jpe?g|png|gif|webp)$/i.test(n)&&!zip.files[n].dir});
  names.sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})});
  if(!names.length) throw new Error('No images in archive');
  var wrap=document.createElement('div');
  wrap.className='pages';
  body.innerHTML='';
  body.appendChild(wrap);
  var max=Math.min(names.length,60);
  for(var i=0;i<max;i++){
    var bb=await zip.files[names[i]].async('blob');
    var img=document.createElement('img');
    img.src=URL.createObjectURL(bb);
    img.alt='Page '+(i+1);
    wrap.appendChild(img);
  }
}

async function showEPUB(body,blob){
  // Minimal: unzip and show text from xhtml if possible
  if(!window.JSZip){
    body.innerHTML='<div class="spin">EPUB needs network once to load tools.</div>';
    return;
  }
  try{
    var zip=await JSZip.loadAsync(blob);
    var htmls=Object.keys(zip.files).filter(function(n){return /\.(xhtml|html|htm)$/i.test(n)&&!zip.files[n].dir});
    htmls.sort();
    var parts=[];
    var max=Math.min(htmls.length,15);
    for(var i=0;i<max;i++){
      var t=await zip.files[htmls[i]].async('text');
      t=t.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'');
      parts.push(t);
    }
    body.innerHTML='<div class="txt">'+parts.join('<hr style="margin:24px 0;opacity:.2"/>')+'</div>';
  }catch(e){
    body.innerHTML='<div class="spin">Could not parse EPUB</div>';
  }
}

$('#rClose').onclick=function(){
  $('#reader').classList.remove('on');
  $('#rbody').innerHTML='';
};

function toggleTheme(){
  var d=document.documentElement;
  var dark=d.getAttribute('data-theme')==='dark';
  if(dark) d.removeAttribute('data-theme'); else d.setAttribute('data-theme','dark');
  localStorage.setItem('folio-theme', dark?'light':'dark');
  var meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.content=dark?'#F2EEE3':'#0D0D0D';
  toast(dark?'Light mode':'Dark mode');
}
$('#btnTheme').onclick=toggleTheme;
$('#navTheme').onclick=toggleTheme;
if(localStorage.getItem('folio-theme')==='dark'){
  document.documentElement.setAttribute('data-theme','dark');
  var meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.content='#0D0D0D';
}

$('#btnClear').onclick=async function(){
  if(!confirm('Delete all books?')) return;
  for(var i=0;i<books.length;i++){
    await idbDel('books',books[i].id);
    await idbDel('blobs',books[i].id);
  }
  books=[];
  render();
  toast('Library cleared');
};

document.querySelectorAll('#filters button').forEach(function(btn){
  btn.onclick=function(){
    document.querySelectorAll('#filters button').forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');
    filter=btn.getAttribute('data-f');
    render();
  };
});

$('#navHome').onclick=function(){
  $('#reader').classList.remove('on');
};

openDB().then(function(){
  greet();
  return refresh();
}).then(function(){
  toast('Ready — tap Import or +');
}).catch(function(e){
  toast('Storage error: '+(e.message||e));
  greet();
  empty.hidden=false;
});
})();
</script>
</body>
</html>
