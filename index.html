<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#F2EEE3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Folio" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Folio — Universal Reader</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="components.css" />
</head>
<body>
  <!-- App shell -->
  <div id="app">
    <!-- Library view -->
    <main id="library-view" class="view active">
      <header class="top-bar">
        <div class="brand">
          <span class="logo">Folio</span>
        </div>
        <div class="top-actions">
          <button id="btn-install" class="btn-icon" title="Install app" hidden>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          </button>
          <button id="btn-settings" class="btn-icon" title="Settings">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <section class="greeting" id="greeting">
        <h1 class="greeting-text">Good afternoon</h1>
        <p class="greeting-sub">Your library</p>
      </section>

      <!-- Continue reading -->
      <section id="continue-section" class="shelf-section" hidden>
        <h2 class="shelf-title">Continue reading</h2>
        <div id="continue-row" class="horizontal-scroll"></div>
      </section>

      <!-- Filters / Tabs -->
      <nav class="filter-tabs" id="filter-tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="book">Books</button>
        <button class="tab" data-filter="comic">Comics</button>
        <button class="tab" data-filter="doc">Docs</button>
      </nav>

      <!-- Library grid -->
      <section id="library-grid" class="library-grid">
        <!-- populated by JS -->
      </section>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state">
        <div class="empty-art">
          <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
            <rect x="20" y="15" width="50" height="70" rx="4" stroke="currentColor" stroke-width="3"/>
            <rect x="50" y="30" width="50" height="70" rx="4" stroke="currentColor" stroke-width="3"/>
            <path d="M35 40h20M35 50h15M65 55h20M65 65h15" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <h2>Your library is empty</h2>
        <p>Import PDF, EPUB, DOCX or comic archives</p>
        <button id="btn-import-empty" class="btn-primary">Import files</button>
      </div>
    </main>

    <!-- Reader view -->
    <main id="reader-view" class="view">
      <div id="reader-container" class="reader-container">
        <!-- reader content injected here -->
      </div>

      <!-- Floating pill toolbar -->
      <div id="reader-toolbar" class="reader-toolbar">
        <button id="btn-toc" class="tool-btn" title="Contents">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <button id="btn-bookmark" class="tool-btn" title="Bookmark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        </button>
        <button id="btn-brightness" class="tool-btn" title="Theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button id="btn-aa" class="tool-btn" title="Typography">
          <span style="font-weight:700;font-size:14px">Aa</span>
        </button>
        <button id="btn-close-reader" class="tool-btn" title="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- TOC drawer -->
      <aside id="toc-drawer" class="drawer">
        <div class="drawer-header">
          <h3>Contents</h3>
          <button id="btn-close-toc" class="btn-icon">×</button>
        </div>
        <ul id="toc-list" class="toc-list"></ul>
      </aside>

      <!-- Typography panel -->
      <div id="typo-panel" class="panel">
        <div class="panel-row">
          <label>Font size</label>
          <input type="range" id="font-size" min="14" max="28" value="18" />
        </div>
        <div class="panel-row">
          <label>Line height</label>
          <input type="range" id="line-height" min="1.2" max="2" step="0.1" value="1.6" />
        </div>
        <div class="panel-row">
          <label>Margins</label>
          <input type="range" id="margins" min="0" max="48" value="24" />
        </div>
        <div class="panel-row">
          <label>Font</label>
          <select id="font-family">
            <option value="serif">Serif</option>
            <option value="sans">Sans</option>
            <option value="mono">Mono</option>
          </select>
        </div>
      </div>
    </main>

    <!-- Settings view -->
    <main id="settings-view" class="view">
      <header class="top-bar">
        <button id="btn-back-settings" class="btn-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2>Settings</h2>
        <div></div>
      </header>
      <section class="settings-section">
        <h3>Theme</h3>
        <div class="theme-picker">
          <button class="theme-card" data-theme="editorial">
            <div class="theme-preview editorial"></div>
            <span>Editorial</span>
          </button>
          <button class="theme-card" data-theme="glass">
            <div class="theme-preview glass"></div>
            <span>Soft Glass</span>
          </button>
          <button class="theme-card" data-theme="pop">
            <div class="theme-preview pop"></div>
            <span>Pop Dark</span>
          </button>
        </div>
      </section>
      <section class="settings-section">
        <h3>Reading</h3>
        <label class="toggle-row">
          <span>Auto dark mode</span>
          <input type="checkbox" id="auto-dark" />
        </label>
        <label class="toggle-row">
          <span>Manga mode (RTL)</span>
          <input type="checkbox" id="manga-rtl" />
        </label>
      </section>
      <section class="settings-section">
        <h3>Storage</h3>
        <p id="storage-info">Calculating…</p>
        <button id="btn-clear-library" class="btn-danger">Clear library</button>
      </section>
      <section class="settings-section">
        <h3>About</h3>
        <p>Folio v1.0 — Universal reader<br>PDF · EPUB · DOCX · CBZ · CBR</p>
      </section>
    </main>

    <!-- Bottom tab bar (Pop Dark style + always present) -->
    <nav id="tab-bar" class="tab-bar">
      <button class="tab-item active" data-view="library">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="tab-item" data-view="import">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span>Import</span>
      </button>
      <button class="tab-item" data-view="favorites">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        <span>Favs</span>
      </button>
      <button class="tab-item" data-view="settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <!-- Hidden file input -->
    <input type="file" id="file-input" multiple accept=".pdf,.epub,.docx,.cbz,.cbr,application/pdf,application/epub+zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.comicbook+zip,application/x-cbr" hidden />

    <!-- Toast -->
    <div id="toast" class="toast" hidden></div>
  </div>

  <!-- Libraries via CDN (ESM where possible) -->
  <script type="importmap">
  {
    "imports": {
      "idb": "https://cdn.jsdelivr.net/npm/idb@8/+esm",
      "pdfjs-dist": "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs",
      "epubjs": "https://cdn.jsdelivr.net/npm/epubjs@0.3.93/+esm",
      "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
